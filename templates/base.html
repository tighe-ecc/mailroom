<!doctype html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mailroom</title>
  <link rel="icon" type="image/png" href="/static/icon.png" />
  <link rel="apple-touch-icon" href="/static/icon.png" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Inter", sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    /* HTMX indicator: hide completely (not just opacity) so buttons don't reserve spinner space when idle */
    .htmx-indicator { display: none !important; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { display: inline-block !important; }
    /* Inline-edit inputs in detail modal: look like plain text until focused. */
    .detail-inline {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 2px 4px;
      outline: none;
      transition: background 120ms, border-color 120ms;
    }
    /* daisyUI v4 stores theme color tokens (--b2, --b3, --p, --bc) as OKLCH
       triples, so they must be wrapped with oklch(...). Using hsl() silently
       produces an invalid color and the browser falls back to transparent. */
    .detail-inline:hover { border-color: oklch(var(--b3, 89.59% 0.0103 256.85)); }
    .detail-inline:focus {
      background: oklch(var(--b2, 93.55% 0.0107 256.85));
      border-color: oklch(var(--p, 49.12% 0.3096 275.75) / 0.5);
    }
    .detail-inline::placeholder { color: oklch(var(--bc, 27.81% 0.0296 256.85) / 0.3); }
  </style>
</head>
<body class="bg-base-200 min-h-screen">
  <div class="max-w-6xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </div>
  <script type="module">
    import { initFeedback } from '/static/feedback-button.js?v={{ static_v('feedback-button.js') }}';
    initFeedback({ endpoint: '/feedback', toolName: 'procurement-tracker' });
  </script>
</body>
</html>
