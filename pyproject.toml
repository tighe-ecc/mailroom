[project]
name = "mailroom"
version = "0.1.0"
description = "Personal mailroom: unified order and package tracker with FastAPI + Tailwind/DaisyUI dashboard, LLM email parsing, EasyPost carrier polling, and macOS notifications."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "easypost>=9.0",
    "openai>=1.50",
    "html2text>=2024.2.26",
    "watchdog>=4.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
mailroom = "mailroom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom"]
